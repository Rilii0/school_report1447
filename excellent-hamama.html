<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كتيب رصد السلوك المتميز</title>
<style>
:root{--bg:#d9e2ee;--page:#fff;--tx:#1b2430;--mut:#667085;--ac:#1f4e78;--acs:#e3edf8;--bd:#e1e5ec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1018;--page:#17212f;--tx:#e8edf4;--mut:#9aa7b8;--ac:#7db4e6;--acs:#233a54;--bd:#26344a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1018;--page:#17212f;--tx:#e8edf4;--mut:#9aa7b8;--ac:#7db4e6;--acs:#233a54;--bd:#26344a;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;display:flex;flex-direction:column;align-items:center}
#stage{flex:1;min-height:0;width:100%;max-width:900px;padding:12px;box-sizing:border-box;perspective:1400px}
#page{height:100%;box-sizing:border-box;overflow-y:auto;background:var(--page);border-radius:6px 16px 16px 6px;border-right:8px solid var(--ac);box-shadow:0 8px 30px #0003;padding:18px;transform-origin:right center}
.n{animation:tn .5s ease}.p{animation:tp .5s ease}
@keyframes tn{from{transform:rotateY(75deg);opacity:.15}to{transform:none;opacity:1}}
@keyframes tp{from{transform:rotateY(-40deg);opacity:.15}to{transform:none;opacity:1}}
h1{font-size:1.5rem;color:var(--ac);margin:0 0 4px}h2{font-size:1.2rem;color:var(--ac);margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 14px;font-size:.9rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--acs);border-radius:10px;padding:8px 12px}.kpi b{display:block;font-size:1.35rem;color:var(--ac)}.kpi span{font-size:.8rem;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-bottom:12px}
.card{border:1px solid var(--bd);border-radius:12px;padding:10px 12px}.card h3{margin:0 0 6px;font-size:.95rem}
svg{width:100%;height:auto;display:block}
.gl{stroke:var(--bd)}.ax{fill:var(--mut);font-size:11px}.hit{cursor:pointer}.hit:hover{opacity:.75}
.tip{margin-top:6px;padding:5px 10px;border-radius:8px;background:var(--acs);font-size:.85rem;min-height:1.4em}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;margin-top:4px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px}
.note{background:var(--acs);border-radius:10px;padding:8px 12px;font-size:.85rem;margin-bottom:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85rem;text-align:center}th,td{border:1px solid var(--bd);padding:5px 7px}th{background:var(--ac);color:var(--page)}tfoot td{font-weight:700;background:var(--acs)}
.toc button{display:block;width:100%;text-align:start;font:inherit;color:var(--tx);background:var(--acs);border:0;border-radius:10px;padding:10px 14px;margin:6px 0;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}.chips b{font-size:.8rem;color:var(--mut);align-self:center;margin-inline-end:4px}.chips button{font:inherit;font-size:.85rem;border:1px solid var(--bd);background:var(--page);color:var(--tx);border-radius:16px;padding:4px 12px;cursor:pointer}.chips button.on{background:var(--ac);color:var(--page);border-color:var(--ac)}.ins{margin:0;padding-inline-start:20px}.ins li{margin:4px 0}
.big{font-size:3.4rem;font-weight:700;color:var(--ac);line-height:1.1;margin:18px 0 0}
#bar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;max-width:900px;box-sizing:border-box;padding:6px 14px 12px}
#bar button{font:inherit;border:0;border-radius:20px;padding:8px 18px;background:var(--ac);color:var(--page);cursor:pointer}#bar button:disabled{opacity:.35}
#dots{display:flex;gap:6px}#dots b{width:9px;height:9px;border-radius:50%;background:var(--mut);opacity:.35;cursor:pointer}#dots b.on{opacity:1;background:var(--ac);width:22px;border-radius:5px}

#pr{display:none}
@media print{
 @page{size:A4;margin:12mm}
 html,body{height:auto!important;background:#fff!important;display:block!important}
 #stage,#bar{display:none!important}
 #pr{display:block!important}
 #pr section{break-after:page;page-break-after:always;color:#1b2430;background:#fff;padding:0}
 #pr section:last-child{break-after:auto;page-break-after:auto}
 #pr *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #pr .card,#pr .kpi{break-inside:avoid}
 #pr .tip,#pr .toc,#pr .note.noprint,#pr .prbtn{display:none!important}
 #pr .grid{grid-template-columns:1fr 1fr}
 #pr{--page:#fff;--tx:#1b2430;--mut:#667085;--ac:#1f4e78;--acs:#e3edf8;--bd:#cfd6e0}
}
.prbtn{font:inherit;margin-top:14px;border:1px solid var(--ac);background:transparent;color:var(--ac);border-radius:20px;padding:8px 18px;cursor:pointer}
</style>
</head>
<body>
<div id="stage"><div id="page"></div></div>
<div id="pr"></div>
<div id="bar"><button id="pv">▶ السابق</button><div id="dots"></div><button id="nx">التالي ◀</button></div>
<script>
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const sum=a=>a.reduce((x,y)=>x+y,0);
const T=["التعاون","الإذاعة","الانضباط","رسالة شكر","مهارات الاتصال"];
const C=["#2f6fb0","#e08a2c","#3a9d6e","#b24b8f","#8a8f98"];
const U1='الصف غير واضح في الورقة',U2='التاريخ مفترض (نفس تاريخ السجل السابق)';
const R=[
[1447,7,12,'','هدى الشهري',[0],''],
[1447,7,29,'','رهف العماري',[0],''],
[1447,7,30,'','حليمة الزبيدي',[0],''],
[1447,8,6,'','ناعمة الجدعاني',[0],''],
[1447,8,7,'','ناعمة الجدعاني',[0],''],
[1447,8,8,'','جميلة الزهراني',[3],''],
[1447,8,10,'','صفية كلنتن',[0],''],
[1447,8,10,'','تهاني الغامدي',[0],''],
[1447,8,16,'','أحلام الزهراني',[0],''],
[1447,9,7,'','أحلام الزهراني',[2],''],
[1447,9,12,'','سارة الغامدي',[0],''],
[1447,9,14,'','أحلام الزهراني',[2],''],
[1447,10,27,'سادس ١','أريج',[0],''],
[1447,10,27,'خامس ٦','نورة الدوسري',[1],''],
[1447,10,27,'رابع ٢','زاهرة القرني',[0],''],
[1447,10,27,'رابع ٦','شمسية',[0],''],
[1447,10,27,'سادس ٢','صفية البارقي',[0,1],''],
[1447,10,27,'رابع ٧','عائشة الغامدي',[1,3],''],
[1447,10,27,'رابع ٨','نعمة',[0],''],
[1447,10,27,'خامس ٦','سارة الغامدي',[0],''],
[1447,11,2,'سادس ٤','الهام',[0,1],''],
[1447,11,2,'سادس ٥','أمل الشمراني',[0,1],''],
[1447,11,3,'سادس ٦','نادية هزازي',[0],''],
[1447,11,3,'رابع ١٠ / خامس ١٠','هدى الزهراني',[0,2],U1],
[1447,11,3,'خامس ٢','صفية البارقي',[0],''],
[1447,11,4,'خامس ٢ إلى ٦','ناعمة',[4],U1],
[1447,11,4,'سادس ٢','ناعمة',[0],''],
[1447,11,5,'رابع','فادية',[0],''],
[1447,11,5,'رابع','بدرية',[0],''],
[1447,11,10,'سادس','صفية',[0],''],
[1447,11,12,'رابع / خامس','تغريد',[0],''],
[1447,12,15,'','ناعمة الجدعاني',[1],''],
[1447,12,17,'','أحلام الزهراني',[0],''],
[1447,12,18,'','صفية كلنتن',[0],''],
[1447,12,22,'','صفية كلنتن',[0],''],
[1448,3,26,'','رهف العماري',[0],''],
[1448,3,26,'','حمامة الزهراني',[0],U2],
[1448,4,25,'الكل','المعلمات',[1,3],''],
[1448,4,25,'الكل','الإداريات',[1,3],U2]];
const YM={1447:[7,8,9,10,11,12],1448:[3,4]};
const GS={1447:{7:[2025,12,21,30],8:[2026,1,20,29],9:[2026,2,18,30],10:[2026,3,20,29],11:[2026,4,18,30],12:[2026,5,18,29]},1448:{3:[2026,8,14,29],4:[2026,9,12,30]}};
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const gdt=(y,m,d)=>{const [Y,M,D]=GS[y][m];return new Date(Date.UTC(Y,M-1,D+d-1))};
const gfmt=(dt,wy)=>ar(dt.getUTCDate())+' '+MN[dt.getUTCMonth()]+(wy?' '+ar(dt.getUTCFullYear())+'م':'');
const grange=(y,m)=>{const x=gdt(y,m,1),z=gdt(y,m,GS[y][m][3]);return gfmt(x,x.getUTCFullYear()!=z.getUTCFullYear())+' – '+gfmt(z,true)};
let M,cy,RS,F;const FY={};
function ctx(y){cy=y;M=YM[y];RS=R.filter(r=>r[0]==y);if(!FY[y])FY[y]={m:new Set(M),t:new Set([0,1,2,3,4])};F=FY[y]}
const rm=m=>RS.filter(r=>r[1]==m);
const tc=(l,sel)=>T.map((_,i)=>(sel&&!sel.has(i))?0:l.filter(r=>r[5].includes(i)).length);
const staff=l=>{const o={};l.forEach(r=>o[r[4]]=(o[r[4]]||0)+1);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const topOf=(a,l)=>{const i=a.indexOf(Math.max(...a));return[l[i],a[i]]};
const lv=c=>c==='الكل'?['الكل']:[...new Set(c.match(/رابع|خامس|سادس/g)||[])];
const kpi=(v,l)=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`;
const tip='<div class="tip">المس عمودًا أو شريحة لعرض التفاصيل</div>';
const legend=s=>'<div class="lg">'+s.map(x=>`<span><i style="background:${x.c}"></i>${x.n}</span>`).join('')+'</div>';
function bars(labels,series){
  const W=600,H=250,L=28,B=30,T=10,n=labels.length,tot=labels.map((_,j)=>sum(series.map(s=>s.v[j])));
  const step=Math.ceil(Math.max(...tot,1)/4),tp=step*4,bw=(W-L)/n,w=Math.min(bw*.7,46);let g='';
  for(let k=0;k<=4;k++){const y=T+(H-T-B)*(1-k/4);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" class="gl"/><text x="${L-4}" y="${y+4}" class="ax" text-anchor="end">${step*k}</text>`}
  labels.forEach((lb,j)=>{let acc=0;const x=L+bw*j+(bw-w)/2;
    series.forEach(s=>{const v=s.v[j];if(!v)return;const h=(H-T-B)*v/tp;acc+=v;g+=`<rect x="${x}" y="${H-B-(H-T-B)*acc/tp}" width="${w}" height="${h}" rx="2" fill="${s.c}" class="hit" data-t="${lb} · ${s.n}: ${v} (المجموع ${tot[j]})"/>`});
    if(j%Math.ceil(n/12)==0)g+=`<text x="${x+w/2}" y="${H-12}" class="ax" text-anchor="middle">${lb}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function donut(items){
  items=items.filter(x=>x.v>0);const t=sum(items.map(x=>x.v)),R=60,Cc=2*Math.PI*R;let off=0,g='';
  items.forEach(x=>{const l=Cc*x.v/t;g+=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${x.c}" stroke-width="34" stroke-dasharray="${l} ${Cc-l}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)" class="hit" data-t="${x.n}: ${x.v} (${(100*x.v/t).toFixed(0)}٪)"/>`;off+=l});
  return `<svg viewBox="0 0 200 200" style="max-width:240px;margin:auto">${g}<text x="100" y="106" text-anchor="middle" style="fill:var(--tx);font-size:20px;font-weight:700">${t}</text></svg>`;
}
function line(labels,vals){
  const W=600,H=220,L=28,B=26,T=10,n=labels.length,mx=Math.max(...vals,1);let pts='',dots='',tx='';
  labels.forEach((lb,j)=>{const x=L+(W-L-10)*j/(n-1),y=H-B-(H-T-B)*vals[j]/mx;pts+=`${x},${y} `;
    dots+=`<circle cx="${x}" cy="${y}" r="5" fill="${C[0]}" class="hit" data-t="${lb}: ${vals[j]} استدعاء"/>`;
    if(j%Math.ceil(n/7)==0)tx+=`<text x="${x}" y="${H-8}" class="ax" text-anchor="middle">${lb}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${L}" x2="${W}" y1="${H-B}" y2="${H-B}" class="gl"/><polyline points="${pts}" fill="none" stroke="${C[0]}" stroke-width="2.5"/>${dots}${tx}<text x="${L-4}" y="${T+8}" class="ax" text-anchor="end">${mx}</text></svg>`;
}

const card=(t,body,lg)=>`<div class="card"><h3>${t}</h3>${body}${lg||''}${tip}</div>`;
const lg=l=>{const c=tc(l);return legend(T.map((t,i)=>({n:t,c:C[i]})).filter((_,i)=>c[i]>0))};
const tdonut=(l,sel)=>{const c=tc(l,sel);return donut(T.map((t,i)=>({n:t,c:C[i],v:c[i]})))};
const tser=(keys,f,sel)=>T.map((t,i)=>({n:t,c:C[i],v:keys.map(k=>tc(f(k),sel)[i])})).filter(x=>x.v.some(v=>v>0));
const stTable=(st,n)=>`<div class="tw"><table><thead><tr><th>#</th><th>الموظفة</th><th>عدد السجلات</th></tr></thead><tbody>${st.slice(0,n).map((x,i)=>`<tr><td>${i+1}</td><td>${x[0]}</td><td><b>${x[1]}</b></td></tr>`).join('')}</tbody></table></div>`;
const yN=y=>R.filter(r=>r[0]==y).length;
function cover(){
  const blk=y=>{const I=IDX[y];return `<h3 style="margin:14px 0 4px;color:var(--ac)">${ar(y)}هـ · ${yN(y)} سجل</h3><div class="toc"><button data-go="${I.dash}">لوحة المتابعة · فلترة حسب الشهر ونوع السلوك</button><button data-go="${I.sum}">الملخص العام</button>${YM[y].map(m=>`<button data-go="${I.m[m]}">شهر ${ar(m)} · ${R.filter(r=>r[0]==y&&r[1]==m).length} سجل</button>`).join('')}</div>`};
  return `<h1>رصد السلوك المتميز</h1><p class="sub">العامان ١٤٤٧ و١٤٤٨هـ</p><p class="sub" style="margin-top:2px">منسقة نور: حمامة الزهراني</p><div class="big">${R.length}</div><p class="sub">إجمالي سجلات السلوك المتميز</p><p class="sub" style="font-size:.78rem">السجل الذي فيه أكثر من نوع سلوك يُحسب في كل نوع داخل الرسوم. التواريخ الميلادية بحسب تقويم أم القرى، وقد تختلف يومًا واحدًا عن الرؤية الفعلية.</p><p class="sub">قلّب الصفحات بالأزرار أو بالسحب، أو اختر من الفهرس:</p><button class="prbtn" data-print="1">🖨 طباعة / حفظ PDF</button>${blk(1447)}${blk(1448)}`}
function divider(y){ctx(y);const st=staff(RS),e=M[M.length-1];
  return `<div style="min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center"><p class="sub">رصد السلوك المتميز</p><div class="big" style="font-size:5rem">${ar(y)}هـ</div><p class="sub">الأشهر ${M.map(ar).join('، ')}</p><p class="sub">الموافق: ${gfmt(gdt(y,M[0],1),true)} – ${gfmt(gdt(y,e,GS[y][e][3]),true)}</p><p class="sub" style="margin-top:2px">منسقة نور: حمامة الزهراني</p><div class="kpis" style="width:100%;max-width:440px">${kpi(RS.length,'عدد السجلات')}${kpi(st.length,'عدد الموظفات')}${kpi(M.length,'أشهر')}</div><button class="prbtn" data-go="${IDX[y].dash}">ابدأ ◀</button></div>`}
function summary(){
  const n=RS.length,st=staff(RS),tt=topOf(tc(RS),T);
  const lc={};RS.forEach(r=>lv(r[3]).forEach(l=>lc[l]=(lc[l]||0)+1));const lk=['رابع','خامس','سادس','الكل'].filter(k=>lc[k]);
  return `<h2>الملخص العام · ${ar(cy)}هـ</h2><div class="kpis">${kpi(n,'عدد السجلات')}${kpi(st.length,'عدد الموظفات')}${kpi(tt[0],'أكثر نوع ('+tt[1]+')')}${kpi(st[0][1],st[0][0])}</div>
  <div class="grid">${card('كل شهر حسب نوع السلوك',bars(M.map(m=>'شهر '+m),tser(M,m=>rm(m))),lg(RS))}${card('نسبة كل نوع',tdonut(RS),lg(RS))}</div>
  ${lk.length?`<div class="card" style="margin-bottom:12px"><h3>حسب الصف (للسجلات المسجّل فيها الصف)</h3>${bars(lk,[{n:'عدد السجلات',c:C[0],v:lk.map(k=>lc[k])}])}${tip}</div>`:''}
  <div class="grid"><div class="card"><h3>أكثر الموظفات رصداً</h3>${stTable(st,10)}</div><div class="card"><h3>الأشهر وأنواع السلوك</h3><div class="tw"><table><thead><tr><th>الشهر</th>${T.map(t=>'<th>'+t+'</th>').join('')}<th>السجلات</th></tr></thead><tbody>${M.map(m=>{const l=rm(m),c=tc(l);return `<tr><td>${ar(m)}</td>${c.map(x=>'<td>'+(x||'·')+'</td>').join('')}<td><b>${l.length}</b></td></tr>`}).join('')}</tbody><tfoot><tr><td>الإجمالي</td>${tc(RS).map(x=>'<td>'+x+'</td>').join('')}<td>${n}</td></tr></tfoot></table></div></div></div>`;
}
function month(m){
  const L=rm(m),ds=[...new Set(L.map(r=>r[2]))].sort((a,b)=>a-b),st=staff(L),tt=topOf(tc(L),T);
  const rows=L.slice().sort((a,b)=>a[2]-b[2]);
  return `<h2>شهر ${ar(m)} · ${ar(cy)}هـ</h2><p class="sub">الموافق: ${grange(cy,m)}</p>${L.some(r=>r[6])?'<div class="note">⚠ بعض السجلات غير واضحة في الورقة أو مفترضة، وهي موضحة في عمود الملاحظات.</div>':''}<div class="kpis">${kpi(L.length,'عدد السجلات')}${kpi(st.length,'عدد الموظفات')}${kpi(tt[0],'أكثر نوع ('+tt[1]+')')}${kpi(ds.length,'أيام الرصد')}</div>
  <div class="grid">${card('حسب اليوم ونوع السلوك',bars(ds.map(d=>'يوم '+d),tser(ds,d=>L.filter(r=>r[2]==d))),lg(L))}${card('نسبة كل نوع',tdonut(L),lg(L))}</div>
  <div class="card"><div class="tw"><table><thead><tr><th>التاريخ الهجري</th><th>التاريخ الميلادي</th><th>الصف</th><th>الموظفة</th><th>نوع السلوك</th><th>ملاحظات</th></tr></thead><tbody>${rows.map(r=>`<tr><td style="white-space:nowrap">${ar(cy)}/${ar(m)}/${ar(r[2])}هـ</td><td style="white-space:nowrap">${gfmt(gdt(cy,m,r[2]),true)}</td><td>${r[3]||'—'}</td><td>${r[4]}</td><td>${r[5].map(i=>T[i]).join(' / ')}</td><td>${r[6]?'⚠ '+r[6]:''}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function dash(){
  const chips=`<h2>لوحة المتابعة · ${ar(cy)}هـ</h2><div class="chips"><b>الشهر:</b><button data-fm="all" class="${F.m.size==M.length?'on':''}">الكل</button>${M.map(m=>`<button data-fm="${m}" class="${F.m.size<M.length&&F.m.has(m)?'on':''}">شهر ${m}</button>`).join('')}</div><div class="chips"><b>النوع:</b><button data-ft="all" class="${F.t.size==T.length?'on':''}">الكل</button>${T.map((t,i)=>`<button data-ft="${i}" class="${F.t.size<T.length&&F.t.has(i)?'on':''}">${t}</button>`).join('')}</div>`;
  const fl=RS.filter(r=>F.m.has(r[1])&&r[5].some(i=>F.t.has(i)));
  if(!fl.length)return chips+'<div class="note">لا توجد سجلات للاختيار الحالي.</div>';
  const st=staff(fl),tcs=tc(fl,F.t),tt=topOf(tcs,T);
  const keys=[...new Set(fl.map(r=>r[1]*100+r[2]))].sort((a,b)=>a-b);
  const kf=k=>fl.filter(r=>r[1]*100+r[2]==k);
  const pk=keys.reduce((a,b)=>kf(b).length>kf(a).length?b:a);
  const ds=keys.length;const pm=Math.floor(pk/100),pd=pk%100;
  return chips+`<div class="kpis">${kpi(fl.length,'عدد السجلات')}${kpi(st.length,'عدد الموظفات')}${kpi(tt[0],'أكثر نوع ('+tt[1]+')')}${kpi(ds,'أيام الرصد')}</div>
  <div class="grid">${card('حسب اليوم ونوع السلوك',bars(keys.map(k=>(k%100)+'/'+Math.floor(k/100)),tser(keys,kf,F.t)),lg(fl))}${card('نسبة كل نوع',tdonut(fl,F.t),lg(fl))}</div>
  <div class="grid"><div class="card"><h3>أبرز ما يلفت</h3><ul class="ins"><li>أكثر نوع: ${tt[0]} (${tt[1]} مرة).</li><li>أكثر موظفة: ${st[0][0]} بـ ${st[0][1]} من السجلات.</li><li>أكثر يوم رصداً: ${pd}/${pm} (${gfmt(gdt(cy,pm,pd),true)}) بـ ${kf(pk).length} من السجلات.</li></ul></div><div class="card"><h3>أكثر الموظفات رصداً</h3>${stTable(st,8)}</div></div>`;
}
const P=[],PY=[],IDX={};let cur=-1;
const add=(y,f)=>{P.push(()=>{ctx(y);return f()});PY.push(y)};
P.push(cover);PY.push(1447);
[1447,1448].forEach(y=>{const I=IDX[y]={m:{}};I.div=P.length;add(y,()=>divider(y));I.dash=P.length;add(y,dash);I.sum=P.length;add(y,summary);YM[y].forEach(m=>{I.m[m]=P.length;add(y,()=>month(m))})});
const pg=document.getElementById('page');
document.getElementById('dots').innerHTML=P.map((_,i)=>`<b data-go="${i}"></b>`).join('');
function go(i,dir){
  if(i<0||i>=P.length)return;dir=dir||(i>=cur?'n':'p');cur=i;pg.innerHTML=P[i]();pg.scrollTop=0;
  pg.className='';void pg.offsetWidth;pg.className=dir;
  document.querySelectorAll('#dots b').forEach((b,j)=>b.classList.toggle('on',j==i));
  document.getElementById('pv').disabled=i==0;document.getElementById('nx').disabled=i==P.length-1;
  try{history.replaceState(null,'','#p'+i)}catch(_){}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');
  if(t){const c=t.closest('.card');c.querySelector('.tip').textContent=t.dataset.t;c.querySelectorAll('.sel').forEach(x=>{x.style.opacity='';x.classList.remove('sel')});c.querySelectorAll('[data-t]').forEach(x=>x.style.opacity=.45);t.style.opacity=1;t.classList.add('sel');return}
  const fm=e.target.closest('[data-fm]'),ft=e.target.closest('[data-ft]');
  if(fm||ft){ctx(PY[cur]);const k=fm?'m':'t',all=fm?M:[0,1,2,3,4],v=(fm||ft).dataset[fm?'fm':'ft'];
    if(v==='all')F[k]=new Set(all);else{const n=+v;if(F[k].size==all.length)F[k]=new Set([n]);else{F[k].has(n)?F[k].delete(n):F[k].add(n);if(!F[k].size)F[k]=new Set(all)}}
    const y=pg.scrollTop;pg.innerHTML=P[cur]();pg.scrollTop=y;return}
  if(e.target.closest('[data-print]')){window.print();return}
  const g=e.target.closest('[data-go]');if(g)go(+g.dataset.go);
});
document.getElementById('pv').onclick=()=>go(cur-1,'p');document.getElementById('nx').onclick=()=>go(cur+1,'n');
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(cur+1,'n');if(e.key==='ArrowRight')go(cur-1,'p')});
let sx=null;pg.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
pg.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(dx>70)go(cur+1,'n');if(dx<-70)go(cur-1,'p')});
function fillPrint(){let h='';[1447,1448].forEach(y=>{ctx(y);h+='<section>'+divider(y)+'</section><section>'+summary()+'</section>'+M.map(m=>'<section>'+month(m)+'</section>').join('')});document.getElementById('pr').innerHTML=h}
window.addEventListener('beforeprint',fillPrint);window.addEventListener('afterprint',()=>{document.getElementById('pr').innerHTML=''});
const h=parseInt((location.hash||'').replace('#p',''));go(isNaN(h)?0:h,'n');
</script>
